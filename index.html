<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
    <style>
        #mogoi1{
            width:200px;
            position:absolute;
            margin-top: 0px;
            margin-left: 150px;
            background-color: yellow;
        }
        #mogoi2{
            width:200px;
            position:absolute;
            margin-top: 0px;
            margin-left: 500px;
            background-color: aqua;
        }
    </style>
<body style="margin:0 auto" onkeypress="myFunc(event)">
    <div style="
    width: 100%;
    background-image: url(tree.png);
    background-repeat: no-repeat;
    background-size: contain;
    height: 1500px;
    "
    >
    <img id="mogoi1" src="snake1.png"/>
    <img id="mogoi2" src="snake2.png"/>
    
    </div>
    <script>
        let mogoi1 = document.getElementById("mogoi1");
        let mogoi2 = document.getElementById("mogoi2");
        let top1 = 0;
        let top2 = 0;
        function myFunc(event){
            if(event.key=="d"){
                top1+=50;
                mogoi1.style.marginTop= top1+"px";
            }else if(event.key==="j"){
                top2+=50;
                mogoi2.style.marginTop= top2+"px";
            }
             if(top1 > 750){
                alert("Шар могой хожлоо");
                mogoi1.style.marginTop= 0+"px";
                mogoi2.style.marginTop= 0+"px";
                top1 = 0;
                top2 = 0;
             }else if(top2 > 750){
              alert("Цэнхэр могой хожлоо");
                mogoi1.style.marginTop= 0+"px";
                mogoi2.style.marginTop= 0+"px";
                top1 = 0;
                top2 = 0;   
             }
        }
    </script>
    
</body>
</html>
